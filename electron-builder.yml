appId: com.fuller.ofertas
productName: Fuller Ofertas
copyright: Fuller

# Hook que firma (ad-hoc) el sidecar de Python despues de empaquetar la .app.
afterPack: build/afterPack.js

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron

# El sidecar de Python (compilado con PyInstaller) se incluye como recurso extra
# para que el usuario no necesite tener Python instalado.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"

win:
  target:
    - nsis
  # Sin firma de codigo en el piloto (no hay certificado en el runner).
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Firma ad-hoc (identity "-"): no requiere certificado de Apple, pero deja la
  # app y su sidecar firmados de forma COHERENTE. Esto evita el error
  # "la aplicacion esta danada" que causa una firma inconsistente entre el
  # ejecutable de Electron y el binario de PyInstaller.
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: Fuller <soporte@fuller.local>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
