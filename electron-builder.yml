appId: com.fuller.ofertas
productName: Fuller Ofertas
copyright: Fuller

# Hook que firma (ad-hoc) el sidecar de Python despues de empaquetar la .app.
afterPack: build/afterPack.js

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron

# El sidecar de Python (compilado con PyInstaller) se incluye como recurso extra
# para que el usuario no necesite tener Python instalado.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"

win:
  target:
    - nsis
  # Sin firma de codigo en el piloto (no hay certificado en el runner).
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # IMPORTANTE: dejamos que electron-builder NO firme (identity null). La firma
  # ad-hoc COMPLETA (app + sidecar de Python) la hace nuestro hook afterPack.js,
  # para evitar la doble firma que hacia fallar a electron-builder
  # ("CSC_KEY_PASSWORD not defined" / "not a file").
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: Fuller <soporte@fuller.local>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
